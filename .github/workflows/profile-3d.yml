name: 3D contribution graph

on:
  schedule: # 08:00 UTC, early morning in the US
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # Swap for secrets.PROFILE_3D_TOKEN to include private activity.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit the SVGs if they changed
        run: |
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "Graph unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update 3D contribution graph [skip ci]"
          git pull --rebase
          git push
