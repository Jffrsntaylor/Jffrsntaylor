name: Holographic footer

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/holo.py
      - .github/workflows/holo.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holo-footer
  cancel-in-progress: false

jobs:
  update:
    # The bot's own footer commits never need another pass.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/holo.py
      - name: Commit if the footer changed
        run: |
          if git diff --quiet README.md; then
            echo "Footer unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update holographic footer [skip ci]"
          git pull --rebase
          git push
